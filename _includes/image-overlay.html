<!-- Image overlay -->
<div id="image-overlay" class="image-overlay">
  <button class="overlay-close" aria-label="Close">×</button>
  <!-- src is set at runtime by openImageOverlay below, so html-proofer must skip it -->
  <img class="overlay-image" alt="Full size image" data-proofer-ignore>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const imageOverlay = document.getElementById('image-overlay');
  const overlayImage = imageOverlay.querySelector('.overlay-image');
  const overlayClose = imageOverlay.querySelector('.overlay-close');
  
  // Handle overlay close
  overlayClose.addEventListener('click', function(e) {
    e.stopPropagation();
    imageOverlay.classList.remove('active');
  });
  
  // Close overlay on background click
  imageOverlay.addEventListener('click', function(e) {
    e.stopPropagation();
    if (e.target === imageOverlay) {
      imageOverlay.classList.remove('active');
    }
  });
  
  // Close overlay on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && imageOverlay.classList.contains('active')) {
      imageOverlay.classList.remove('active');
    }
  });
  
  // Global function to open image overlay
  window.openImageOverlay = function(imageSrc) {
    overlayImage.src = imageSrc;
    imageOverlay.classList.add('active');
  };
});
</script>
