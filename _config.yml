linkedin: https://www.linkedin.com/in/dmitriylogunov/
github: https://github.com/dmitriylogunov
stack_overflow: https://stackoverflow.com/users/6563451/dmitriy
description: >- # this means to ignore newlines until "baseurl:"
  Personal portfolio page.
contacts:
  - "+61466966828"
  - "Blackburn South"
  - "VIC"
  - "Full working rights in AU"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://dmitriylogunov.info" # the base hostname & protocol for your site, e.g. http://example.com
github_username: dmitriylogunov

# Build settings
# theme: minima  # Removed to use custom styles
plugins:
  - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

# Cache busting version - update this when CSS changes
css_version: "2.7"

# Color scheme configuration
colors:
  # Core colors
  primary_dark: "#2d1b69"      # Deep violet (gaming purple)
  primary_accent: "#4a2c8e"    # Royal purple
  accent_color: "#6b46c1"      # Bright purple
  accent_light: "#9061d9"      # Light purple
  highlight: "#dec616"         # Golden yellow (from cat image)
  white: "#ffffff"
  off_white: "#faf8ff"         # Slightly purple-tinted white
  gray_light: "#e6e2f0"
  gray_medium: "#7e6d9a"
  gray_dark: "#2e2640"
  
  # Semantic assignments
  header_bg: "#2d1b69"
  nav_bg: "#4a2c8e"
  primary: "#2e2640"
  secondary: "#ffffff"
  text: "#2e2640"
  header_text: "#ffffff"
  contact_link: "#dec616"
  link: "#6b46c1"
  link_hover: "#dec616"
  page_bg: "#faf8ff"
