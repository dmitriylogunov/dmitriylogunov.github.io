# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

name: Dmitriy (Dimi) Logunov
title: Dmitriy Logunov
profession:
  - Coding with Purpose and Passion
email: logunovdm@gmail.com
linkedin: https://www.linkedin.com/in/dmitriylogunov/
github: https://github.com/dmitriylogunov
stack_overflow: https://stackoverflow.com/users/6563451/dmitriy
description: "Personal site of Dmitriy Logunov — things I make and thoughts I share."
contacts:
  - "0466 966 828"
  - "Blackburn South"
  - "VIC"
  - "Full working rights in AU"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://dmitriylogunov.info" # the base hostname & protocol for your site, e.g. http://example.com
github_username: dmitriylogunov

# Build settings
# theme: minima  # Removed to use custom styles
plugins:
  - jekyll-feed

permalink: /posts/:title/
defaults:
  - scope: {path: "", type: "posts"}
    values: {layout: post}

# Post bodies mix markdown paragraphs with raw HTML blocks. Kramdown smartifies the
# former and passes the latter through, which would leave curly and straight
# apostrophes side by side in one post. Straight everywhere matches how the feed has
# rendered since it was built from _data/posts.yml.
kramdown:
  smart_quotes: apos,apos,quot,quot

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# Listed explicitly (not relying on Jekyll's defaults) so classic GitHub Pages'
# Jekyll 3 excludes the same set as local Jekyll 4.
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - test
  - plan
  - WORKFLOW.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - Rakefile
  - vendor
sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

# Cache busting version - update this when CSS changes
css_version: "3.0"

# Color scheme configuration
colors:
  # Core colors
  primary_dark: "#2d1b69"      # Deep violet (gaming purple)
  primary_accent: "#4a2c8e"    # Royal purple
  accent_color: "#6b46c1"      # Bright purple
  accent_light: "#9061d9"      # Light purple
  highlight: "#dec616"         # Golden yellow (from cat image)
  white: "#ffffff"
  off_white: "#faf8ff"         # Slightly purple-tinted white
  gray_light: "#e6e2f0"
  gray_medium: "#7e6d9a"
  gray_dark: "#2e2640"
  
  # Semantic assignments
  header_bg: "#2d1b69"
  nav_bg: "#4a2c8e"
  primary: "#2e2640"
  secondary: "#ffffff"
  text: "#2e2640"
  header_text: "#ffffff"
  contact_link: "#dec616"
  link: "#6b46c1"
  link_hover: "#dec616"
  page_bg: "#faf8ff"
